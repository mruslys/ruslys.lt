    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text: #111827;
            --muted: #6B7280;
            --bg: #FFFFFF;
            --call-bg: #000000;
            --call-bg-hover: #333333;
            --shadow-color: rgba(0, 0, 0, .15);
            --avatar-shadow: rgba(0, 0, 0, .08);
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .card {
            width: 100%;
            max-width: 340px;
            text-align: center;
        }

        .avatar {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 28px;
            box-shadow: 0 10px 30px var(--avatar-shadow);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .phone {
            font-size: 1.15rem;
            color: var(--muted);
            margin-bottom: 22px;
        }

        .phone a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .phone a:hover {
            color: var(--text);
            text-decoration: underline;
        }

        .call-button {
            width: 82px;
            height: 82px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--call-bg);
            border-radius: 50%;
            text-decoration: none;
            transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 10px 30px var(--shadow-color);
        }

        .call-button:hover {
            background: var(--call-bg-hover);
            transform: translateY(-2px);
            box-shadow: 0 16px 40px var(--shadow-color);
        }

        .call-button:active {
            transform: scale(0.96);
        }

        .call-button svg {
            width: 38px;
            height: 38px;
            fill: #FFFFFF;
            display: block;
        }
    </style>
</head>
<body>

<main class="card">
