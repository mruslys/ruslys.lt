<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=yes">
    <meta name="robots" content="noindex, follow">
    <meta name="description" content="{{ page.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border-color: #333333;
            --accent: #ffffff;
            --accent-bg: #ffffff;
            --accent-text: #000000;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            height: 100dvh;
            background-color: var(--bg-color);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 24px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid var(--text-main);
        }

        .avatar { width: 100%; height: 100%; object-fit: cover; }

        h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 24px; color: var(--text-main); }

        .phone-link {
            display: block;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            text-decoration: none;
            margin-bottom: 32px;
            letter-spacing: 0.5px;
        }

        .phone-link:hover { text-decoration: underline; }

        .btn-call {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background-color: var(--accent-bg);
            color: var(--accent-text);
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            transition: opacity 0.2s;
            width: 100%;
        }

        .btn-call:hover { opacity: 0.9; }
        .btn-call svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

<main class="card">
    <div class="avatar-container">
        <img src="/img/w512.png" alt="Mindaugas R." class="avatar" width="120" height="120">
    </div>

    <h1>Mindaugas R.</h1>

    <a href="tel:+37061600055" class="phone-link">+370 616 00055</a>

        Skambinti dabar
    </a>
</main>

</body>
</html>
