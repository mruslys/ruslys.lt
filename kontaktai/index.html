<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=yes">
    <meta name="robots" content="noindex">
    
    <meta name="description" content="{{ page.description }}">
    <!-- Nustatyta moderni temos spalva naršyklės įrankių juostai -->
    <meta name="theme-color" content="#F3F4F6">

    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description }}">
    <meta property="og:image" content="https://ruslys.lt/img/mog.jpg">
    
    {% include favicon.html %}

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Moderni, švari spalvų paletė */
            --text: #1F2937;
            --muted: #6B7280;
            --bg: #F3F4F6; /* Modernus, švelnus "slate" atspalvis */
            --card-bg: #FFFFFF;
            /* Subtili akcentinė spalva */
            --call-bg: #374151; 
            --call-bg-hover: #1F2937;
            --shadow-color: rgba(31, 41, 55, 0.15);
            --avatar-shadow: rgba(0, 0, 0, 0.05);
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .card {
            width: 100%;
            max-width: 340px;
            text-align: center;
            background: var(--card-bg);
            padding: 40px 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
        }

        .avatar-container {
            position: relative;
            width: 128px;
            height: 128px;
            border-radius: 50%;
            margin: 0 auto 28px;
            box-shadow: 0 10px 30px var(--avatar-shadow);
            overflow: hidden;
            background: #eee;
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .avatar-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4; /* Reguliuojamas permatomumas */
            pointer-events: none;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .phone {
            font-size: 1.1rem;
            color: var(--muted);
            margin-bottom: 28px;
        }

        .phone a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .phone a:hover {
            color: var(--text);
        }

        .call-button {
            width: 72px;
            height: 72px;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--call-bg);
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .call-button:hover {
            background: var(--call-bg-hover);
            transform: scale(1.05);
        }

        .call-button svg {
            width: 32px;
            height: 32px;
            fill: #FFFFFF;
        }
    </style>
</head>
<body>

<main class="card">
    <div class="avatar-container">
        <img src="/img/mr.jpg" alt="Mindaugas R." class="avatar" width="128" height="128" fetchpriority="high">
        <img src="/img/512.png" alt="" class="avatar-overlay" width="128" height="128" aria-hidden="true">
    </div>

    <h1>Mindaugas R.</h1>

    <div class="phone">
        <a href="tel:+37061600055">+370&nbsp;616&nbsp;00055</a>
    </div>

    <a href="tel:+37061600055" class="call-button" title="Skambinti Mindaugui" aria-label="Skambinti Mindaugui">

    </a>
</main>

</body>
</html>
