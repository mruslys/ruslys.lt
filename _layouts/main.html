<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Meta įrašai iš YAML front-matter ir automatinė og:image reikšmė -->
    <title>{{ page.title }} | {{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">


    <meta name="theme-color" content="#fcfcfc">

    {% include favicon.html %}
    
    <style>
        {% include style-gallery.html %}
    </style>
  
</head>
<body>
      <div class="container">
        
        <div class="top-home-button-wrapper">
            <a href="{{ site.sell_url | default: site.url }}" class="top-home-button" title="Grįžti į pagrindinį">
                <img src="{{ 'img/w512.png' | relative_url }}" alt="Logo">
            </a>
            <span class="top-logo-text">PARDUODU</span>
        </div>
{{ content }}
        </div>
</body>
</html>
