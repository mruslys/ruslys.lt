<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Skambinti Mindaugui</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Mindaugas R.">
    <link rel="manifest" href="/favicon/site.webmanifest">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            width: 90%;
            max-width: 360px;
            text-align: center;
            padding: 40px 32px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 20px;
            border: 3px solid #fff;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        .icon {
            margin-bottom: 24px;
        }

        .icon img {
            width: 56px;
            height: 56px;
            display: block;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .phone {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            padding: 15px 28px;
            background: #22C55E;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            border-radius: 14px;
            transition: background .2s ease, transform .2s ease;
        }

        .button:hover {
            background: #16A34A;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .hint {
            margin-top: 20px;
            font-size: .9rem;
            color: #999;
        }
    </style>

    <script>
        window.addEventListener("load", () => {
            setTimeout(() => {
                window.location.href = "tel:+37061600055";
            }, 300);
        });
    </script>
</head>
<body>

<div class="card">

    <img
        src="/img/pfp.jpg"
        alt="Mindaugas"
        class="avatar">

    <div class="icon">
        <img src="/img/call.svg" alt="" aria-hidden="true">
    </div>

    <h1>Skambinti Mindaugui</h1>

    <p>Jeigu skambutis neprasidėjo automatiškai, paspauskite mygtuką.</p>

    <div class="phone">+370&nbsp;616&nbsp;00055</div>

    <a class="button" href="tel:+37061600055">
        📞 Skambinti
    </a>

    <div class="hint">
        Atidarys telefono programėlę.
    </div>

</div>

</body>
</html>
