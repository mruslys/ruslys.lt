<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>+370 616 00055</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="format-detection" content="telephone=yes">

    <meta name="robots" content="noindex">
    <meta name="description" content="Susisiekite su manimi telefonu">

    <link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
    <link rel="shortcut icon" href="/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Mindaugas R.">
    <link rel="manifest" href="/favicon/site.webmanifest">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        :root{
            --green:#22C55E;
            --green-hover:#16A34A;
            --text:#111827;
            --muted:#6B7280;
            --bg:#FFFFFF;
        }

        body{
            font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;
            background:var(--bg);
            color:var(--text);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:24px;
        }

        .card{
            width:100%;
            max-width:340px;
            text-align:center;
        }

        .avatar{
            width:128px;
            height:128px;
            border-radius:50%;
            object-fit:cover;
            display:block;
            margin:0 auto 28px;
            box-shadow:0 10px 30px rgba(0,0,0,.08);
        }

        h1{
            font-size:2rem;
            font-weight:700;
            letter-spacing:-0.03em;
            margin-bottom:8px;
        }

        .phone{
            font-size:1.15rem;
            color:var(--muted);
            margin-bottom:22px;
        }

        .call-button{
            width:82px;
            height:82px;
            margin:0 auto;
            display:flex;
            justify-content:center;
            align-items:center;
            background:var(--green);
            border-radius:50%;
            text-decoration:none;
            transition:.2s ease;
            box-shadow:0 10px 30px rgba(34,197,94,.25);
        }

        .call-button:hover{
            background:var(--green-hover);
            transform:translateY(-2px);
            box-shadow:0 16px 40px rgba(34,197,94,.35);
        }

        .call-button:active{
            transform:scale(.96);
        }

        .call-button img{
            width:38px;
            height:38px;
            display:block;
        }
    </style>

</head>
<body>

<div class="card">

    <img
        src="/img/m512.png"
        alt="Mindaugas"
        class="avatar">

    <h1>Mindaugas R.</h1>

    <div class="phone">
        +370&nbsp;616&nbsp;00055
    </div>

    <a
        href="tel:+37061600055"
        class="call-button"
        title="Skambinti Mindaugui"
        aria-label="Skambinti Mindaugui">

        <img src="/img/call.svg" alt="">

    </a>

</div>

</body>
</html>
