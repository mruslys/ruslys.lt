<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Skambinti Mindaugui</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            text-align: center;
            padding: 40px 32px;
            max-width: 360px;
            width: 90%;
        }

        .icon {
            font-size: 54px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .phone {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 15px 28px;
            border-radius: 14px;
            font-weight: 600;
            transition: .2s;
        }

        .button:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .hint {
            margin-top: 20px;
            font-size: .9rem;
            color: #999;
        }

        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            display: block;
            margin: 0 auto 20px;
            border: 3px solid #fff;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }
    </style>

    <script>
        window.onload = function () {
            setTimeout(() => {
                window.location.href = "tel:+37061600055";
            }, 300);
        };
    </script>

</head>
<body>

<div class="card">

    <img
        src="https://m.ruslys.lt/mindaugas.jpg"
        alt="Mindaugas"
        class="avatar">

    <div class="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M224.2 89C216.3 70.1 195.7 60.1 176.1 65.4L170.6 66.9C106 84.5 50.8 147.1 66.9 223.3C104 398.3 241.7 536 416.7 573.1C493 589.3 555.5 534 573.1 469.4L574.6 463.9C580 444.2 569.9 423.6 551.1 415.8L453.8 375.3C437.3 368.4 418.2 373.2 406.8 387.1L368.2 434.3C297.9 399.4 241.3 341 208.8 269.3L253 233.3C266.9 222 271.6 202.9 264.8 186.3L224.2 89z"/></svg></div>

    <h1>Skambinti Mindaugui</h1>

    <p>Jeigu skambutis neprasidėjo automatiškai, paspauskite mygtuką.</p>

    <div class="phone">+370 616 00055</div>

    <a class="button" href="tel:+37061600055">
        Skambinti
    </a>

    <div class="hint">
        Atidarys telefono programėlę.
    </div>

</div>

</body>
</html>
