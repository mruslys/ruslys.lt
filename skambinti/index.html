<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Skambinti Mindaugui</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #fafafa;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .card {
            text-align: center;
            padding: 40px 32px;
            max-width: 360px;
            width: 90%;
        }

        .icon {
            font-size: 54px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .phone {
            font-size: 1.15rem;
            font-weight: 500;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #111;
            color: #fff;
            text-decoration: none;
            padding: 15px 28px;
            border-radius: 14px;
            font-weight: 600;
            transition: .2s;
        }

        .button:hover {
            background: #000;
            transform: translateY(-1px);
        }

        .hint {
            margin-top: 20px;
            font-size: .9rem;
            color: #999;
        }
    </style>

    <script>
        window.onload = function () {
            setTimeout(() => {
                window.location.href = "tel:+37061600055";
            }, 300);
        };
    </script>

</head>
<body>

<div class="card">
    <div class="icon">📞</div>

    <h1>Skambinti Mindaugui</h1>

    <p>Jeigu skambutis neprasidėjo automatiškai, paspauskite mygtuką.</p>

    <div class="phone">+370 616 00055</div>

    <a class="button" href="tel:+37061600055">
        Skambinti
    </a>

    <div class="hint">
        Atidarys telefono programėlę.
    </div>
</div>

</body>
</html>
